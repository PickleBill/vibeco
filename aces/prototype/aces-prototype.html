<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ────────────────────────────────────────────────────────────────────────
   ACES — interactive prototype
   A social golf app built around two loops:
     1) Side games (Skins / Nassau / Nearest-pin) tracked live for a group.
     2) The "Ace Moment" — hole-in-one capture, celebration, and a peer pool.
   All state is local + seeded with a live sample round. No backend.
   ──────────────────────────────────────────────────────────────────────── */

// ── Seed data ──────────────────────────────────────────────────────────────
const COURSE = {
  name: "Cypress Ridge — Par 3 Course",
  pars: [3,3,4,3,3,4,3,3,3], // 9-hole demo
};
const me = "you";
const PLAYERS = [
  { id: "you",  name: "You",        handle: "@you",     avatar: "🟢", hcp: 12 },
  { id: "dre",  name: "Dre",        handle: "@dre",     avatar: "🔵", hcp: 8  },
  { id: "kai",  name: "Kai",        handle: "@kai_g",   avatar: "🟠", hcp: 18 },
  { id: "mara", name: "Mara",       handle: "@mara",    avatar: "🟣", hcp: 5  },
];

// scores[playerId][holeIndex] = strokes (null = not played)
const seedScores = () => {
  const s = {};
  PLAYERS.forEach(p => s[p.id] = Array(COURSE.pars.length).fill(null));
  // first 3 holes already played
  s.you  = [4,3,5, null,null,null,null,null,null];
  s.dre  = [3,4,4, null,null,null,null,null,null];
  s.kai  = [5,3,6, null,null,null,null,null,null];
  s.mara = [3,2,4, null,null,null,null,null,null];
  return s;
};

const fmtTokens = n => (n >= 0 ? "+" : "−") + Math.abs(n);

// ── Skins engine: lowest unique score wins the hole; ties carry over ────────
function computeSkins(scores, pars, perHole = 5) {
  const n = pars.length;
  const won = Object.fromEntries(PLAYERS.map(p => [p.id, 0])); // tokens
  const skinsWon = Object.fromEntries(PLAYERS.map(p => [p.id, 0]));
  let carry = 0;
  const holeOutcome = [];
  for (let h = 0; h < n; h++) {
    const played = PLAYERS.filter(p => scores[p.id][h] != null);
    if (played.length < PLAYERS.length) { holeOutcome.push(null); continue; }
    const lowest = Math.min(...PLAYERS.map(p => scores[p.id][h]));
    const winners = PLAYERS.filter(p => scores[p.id][h] === lowest);
    const pot = perHole * PLAYERS.length + carry;
    if (winners.length === 1) {
      won[winners[0].id] += pot;
      skinsWon[winners[0].id] += 1 + carry / (perHole * PLAYERS.length);
      // everyone pays in
      PLAYERS.forEach(p => { if (p.id !== winners[0].id) won[p.id] -= perHole; });
      // refund the winner's own ante out of pot accounting
      won[winners[0].id] -= perHole;
      holeOutcome.push({ winner: winners[0].id, pot, carried: carry });
      carry = 0;
    } else {
      carry += perHole * PLAYERS.length;
      PLAYERS.forEach(p => won[p.id] -= perHole);
      holeOutcome.push({ winner: null, pot: 0, carried: carry, tie: true });
    }
  }
  return { net: won, skinsWon, carry, holeOutcome };
}

// ── Tiny UI atoms ───────────────────────────────────────────────────────────
const Pill = ({ children, tone="default", className="" }) => {
  const tones = {
    default: "bg-surface-2 text-dusk border-line",
    ace: "bg-ace/10 text-ace border-ace/30",
    flag: "bg-flag/10 text-flag border-flag/30",
    birdie: "bg-birdie/10 text-birdie border-birdie/30",
  };
  return <span className={`inline-flex items-center gap-1 rounded-full border px-2.5 py-0.5 text-[11px] font-semibold tracking-wide ${tones[tone]} ${className}`}>{children}</span>;
};
const Card = ({ children, className="", glow=false }) =>
  <div className={`rounded-2xl border border-line bg-surface ${glow?"shadow-glow":""} ${className}`}>{children}</div>;
const Stat = ({ label, value, sub }) =>
  <div className="flex flex-col">
    <span className="font-display text-2xl font-extrabold leading-none">{value}</span>
    <span className="mt-1 text-[11px] uppercase tracking-widest text-dusk">{label}</span>
    {sub && <span className="text-xs text-dusk/70">{sub}</span>}
  </div>;

const Avatar = ({ p, size=36, ring=false }) =>
  <div style={{width:size,height:size}} className={`grid place-items-center rounded-full bg-surface-2 text-lg ${ring?"ring-2 ring-ace":""}`}>{p.avatar}</div>;

// ── Confetti for the ace moment ──────────────────────────────────────────────
const Confetti = () => {
  const bits = Array.from({length: 60});
  return <div className="pointer-events-none fixed inset-0 z-50 overflow-hidden">
    {bits.map((_,i)=>{
      const left = Math.random()*100, delay = Math.random()*0.6, dur = 1.6+Math.random()*1.4;
      const c = ["#C6FF3A","#36E0A6","#FF5A3C","#ffffff"][i%4];
      return <span key={i} style={{left:left+"%", background:c, animation:`confetti ${dur}s linear ${delay}s forwards`, width:8, height:14}}
        className="absolute top-0 rounded-sm opacity-90" />;
    })}
  </div>;
};

// ════════════════════════════════════════════════════════════════════════════
function App(){
  const [tab, setTab] = useState("today");
  const [scores, setScores] = useState(seedScores);
  const [activeHole, setActiveHole] = useState(3); // 0-indexed → hole 4
  const [feed, setFeed] = useState([
    { id:1, who:"mara", kind:"birdie", hole:2, text:"birdie on 2 to steal the skin 🐦", t:"6m" },
    { id:2, who:"dre",  kind:"skin",   hole:1, text:"took the carryover on 1 (+30)", t:"22m" },
  ]);
  const [acePool, setAcePool] = useState({ entry: 20, members: PLAYERS.map(p=>p.id), hit: null });
  const [showAce, setShowAce] = useState(false);

  const skins = useMemo(()=>computeSkins(scores, COURSE.pars, 5), [scores]);

  // log a score for `me` on the active hole, advance, detect ace
  const logScore = (strokes) => {
    setScores(prev => {
      const next = { ...prev, you: [...prev.you] };
      next.you[activeHole] = strokes;
      // sim the rest of the group for the demo so standings move
      PLAYERS.filter(p=>p.id!==me).forEach(p=>{
        if (next[p.id][activeHole]==null){
          const par = COURSE.pars[activeHole];
          next[p.id] = [...next[p.id]];
          next[p.id][activeHole] = Math.max(2, par + [-1,0,0,1,1,2][Math.floor(Math.random()*6)]);
        }
      });
      return next;
    });
    if (strokes === 1){ triggerAce(me, activeHole); }
    else {
      const par = COURSE.pars[activeHole];
      if (strokes <= par-1) pushFeed(me, "birdie", activeHole, `${par-strokes===1?"birdie":"eagle"} on ${activeHole+1} ⛳`);
    }
    setActiveHole(h => Math.min(h+1, COURSE.pars.length-1));
  };

  const pushFeed = (who, kind, hole, text) =>
    setFeed(f => [{ id: Date.now(), who, kind, hole, text, t:"now" }, ...f]);

  const triggerAce = (who, hole) => {
    setShowAce(true);
    const payout = acePool.entry * acePool.members.length;
    setAcePool(p => ({ ...p, hit: { who, hole, payout } }));
    pushFeed(who, "ace", hole, `🕳️ ACE on ${hole+1}. Hole-in-one pool pays ${payout} tokens.`);
    setTimeout(()=>setShowAce(false), 3200);
  };

  const playerById = id => PLAYERS.find(p=>p.id===id);

  return (
    <div className="mx-auto flex min-h-full max-w-md flex-col bg-ink">
      {showAce && <Confetti/>}
      {showAce && <AceOverlay player={playerById(acePool.hit?.who)} hole={(acePool.hit?.hole??0)+1} payout={acePool.hit?.payout}/>}

      <Header tab={tab}/>

      <main className="flex-1 overflow-y-auto px-4 pb-28 pt-3">
        {tab==="today"  && <Today skins={skins} scores={scores} acePool={acePool} setTab={setTab} feed={feed} playerById={playerById}/>}
        {tab==="round"  && <Round scores={scores} skins={skins} activeHole={activeHole} setActiveHole={setActiveHole} logScore={logScore}/>}
        {tab==="feed"   && <Feed feed={feed} playerById={playerById}/>}
        {tab==="wallet" && <Wallet skins={skins} acePool={acePool} playerById={playerById}/>}
        {tab==="you"    && <You skins={skins}/>}
      </main>

      <TabBar tab={tab} setTab={setTab}/>
    </div>
  );
}

// ── Chrome ───────────────────────────────────────────────────────────────────
const Header = ({tab}) => {
  const titles = { today:"Aces", round:"Live Round", feed:"The Feed", wallet:"Settle Up", you:"You" };
  return (
    <header className="sticky top-0 z-20 flex items-center justify-between border-b border-line bg-ink/85 px-4 py-3 backdrop-blur">
      <div className="flex items-center gap-2">
        <div className="grid h-7 w-7 place-items-center rounded-lg bg-ace text-ink font-display font-extrabold">A</div>
        <span className="font-display text-lg font-extrabold tracking-tight">{titles[tab]}</span>
      </div>
      <div className="flex items-center gap-2">
        <Pill tone="flag"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-flag"/>LIVE</Pill>
        <div className="grid h-8 w-8 place-items-center rounded-full bg-surface-2 text-base">🟢</div>
      </div>
    </header>
  );
};

const TabBar = ({tab, setTab}) => {
  const items = [
    ["today","Today","◎"], ["round","Round","⛳"], ["feed","Feed","✦"], ["wallet","Wallet","◈"], ["you","You","◐"],
  ];
  return (
    <nav className="fixed inset-x-0 bottom-0 z-20 mx-auto max-w-md border-t border-line bg-ink/90 px-2 pb-[max(env(safe-area-inset-bottom),10px)] pt-2 backdrop-blur">
      <div className="flex items-stretch justify-between">
        {items.map(([id,label,icon])=>(
          <button key={id} onClick={()=>setTab(id)}
            className={`flex flex-1 flex-col items-center gap-0.5 rounded-xl py-1.5 text-[11px] font-semibold transition ${tab===id?"tab-active":"text-dusk"}`}>
            <span className="text-lg leading-none">{icon}</span>{label}
          </button>
        ))}
      </div>
    </nav>
  );
};

// ── TODAY ──────────────────────────────────────────────────────────────────
const Today = ({skins, scores, acePool, setTab, feed, playerById}) => {
  const myNet = skins.net[me];
  const holesPlayed = scores[me].filter(x=>x!=null).length;
  const leader = [...PLAYERS].sort((a,b)=>skins.net[b.id]-skins.net[a.id])[0];
  return (
    <div className="space-y-4">
      {/* Live round hero */}
      <Card glow className="overflow-hidden">
        <div className="flex items-center justify-between px-4 pt-4">
          <div>
            <Pill tone="flag" className="mb-2"><span className="h-1.5 w-1.5 rounded-full bg-flag"/>ROUND IN PLAY</Pill>
            <h2 className="font-display text-xl font-extrabold leading-tight">{COURSE.name}</h2>
            <p className="text-sm text-dusk">Skins · 5/hole · {PLAYERS.length} players · hole {holesPlayed+1}</p>
          </div>
        </div>
        <div className="mt-4 grid grid-cols-3 gap-2 border-t border-line px-4 py-4">
          <Stat label="Your net" value={<span className={myNet>=0?"text-birdie":"text-flag"}>{fmtTokens(myNet)}</span>}/>
          <Stat label="Holes" value={`${holesPlayed}/${COURSE.pars.length}`}/>
          <Stat label="Leader" value={leader.avatar} sub={leader.name}/>
        </div>
        <button onClick={()=>setTab("round")}
          className="m-4 mt-0 w-[calc(100%-2rem)] rounded-xl bg-ace py-3 font-display font-bold text-ink transition active:scale-[.98]">
          Enter live scoring →
        </button>
      </Card>

      {/* Ace pool */}
      <Card className="p-4">
        <div className="flex items-center justify-between">
          <div>
            <p className="font-display font-bold">Hole-in-One Pool</p>
            <p className="text-sm text-dusk">{acePool.entry} tokens · {acePool.members.length} in · pays <span className="text-ace">{acePool.entry*acePool.members.length}</span></p>
          </div>
          <div className="text-3xl">🕳️</div>
        </div>
        <div className="mt-3 flex -space-x-2">
          {acePool.members.map(id=> <Avatar key={id} p={playerById(id)} size={30}/>)}
        </div>
        <p className="mt-3 text-xs text-dusk">First ace of the round takes the pot. No ace → rolls to next round. <span className="text-ace">Log a 1 on any par-3 in the Round tab to see it fire.</span></p>
      </Card>

      {/* Recent moments */}
      <div>
        <div className="mb-2 flex items-center justify-between">
          <h3 className="font-display font-bold">Recent moments</h3>
          <button onClick={()=>setTab("feed")} className="text-xs font-semibold text-ace">See all</button>
        </div>
        <div className="space-y-2">
          {feed.slice(0,3).map(item=> <FeedRow key={item.id} item={item} playerById={playerById}/>)}
        </div>
      </div>
    </div>
  );
};

// ── ROUND (live scoring) ─────────────────────────────────────────────────────
const Round = ({scores, skins, activeHole, setActiveHole, logScore}) => {
  const par = COURSE.pars[activeHole];
  const options = [1, par-1, par, par+1, par+2].filter((v,i,a)=>v>0 && a.indexOf(v)===i);
  const standings = [...PLAYERS].sort((a,b)=>skins.net[b.id]-skins.net[a.id]);
  return (
    <div className="space-y-4">
      {/* hole strip */}
      <div className="flex gap-1.5 overflow-x-auto pb-1">
        {COURSE.pars.map((p,i)=>{
          const played = scores[me][i]!=null;
          const active = i===activeHole;
          return <button key={i} onClick={()=>setActiveHole(i)}
            className={`flex min-w-[44px] flex-col items-center rounded-lg border px-2 py-1.5 text-xs
              ${active?"border-ace bg-ace/10 text-ace":played?"border-line bg-surface-2 text-zinc-300":"border-line text-dusk"}`}>
            <span className="font-bold">{i+1}</span>
            <span className="text-[10px]">par {p}</span>
          </button>;
        })}
      </div>

      {/* scoring card */}
      <Card glow className="p-5 text-center rise">
        <p className="text-xs uppercase tracking-widest text-dusk">Hole {activeHole+1} · Par {par}</p>
        <p className="mt-1 font-display text-5xl font-extrabold">{scores[me][activeHole] ?? "—"}</p>
        <p className="mt-1 text-sm text-dusk">Tap your score</p>
        <div className="mt-4 grid grid-cols-5 gap-2">
          {options.map(v=>(
            <button key={v} onClick={()=>logScore(v)}
              className={`rounded-xl border py-3 font-display text-lg font-bold transition active:scale-95
                ${v===1?"border-ace bg-ace text-ink shadow-glow":"border-line bg-surface-2 hover:border-ace/50"}`}>
              {v}{v===1 && <span className="block text-[9px] font-semibold">ACE</span>}
            </button>
          ))}
        </div>
        <p className="mt-3 text-[11px] text-dusk">Try tapping <span className="text-ace font-semibold">1</span> to trigger the ace moment.</p>
      </Card>

      {/* live standings */}
      <Card className="p-4">
        <p className="mb-3 font-display font-bold">Skins standings <span className="text-dusk font-normal">· carry {skins.carry}</span></p>
        <div className="space-y-2">
          {standings.map((p,idx)=>(
            <div key={p.id} className="flex items-center gap-3">
              <span className="w-4 text-center text-sm text-dusk">{idx+1}</span>
              <Avatar p={p} size={30} ring={p.id===me}/>
              <span className="flex-1 text-sm font-semibold">{p.name}</span>
              <span className="text-xs text-dusk">{Math.round(skins.skinsWon[p.id])} skins</span>
              <span className={`w-12 text-right font-mono text-sm ${skins.net[p.id]>=0?"text-birdie":"text-flag"}`}>{fmtTokens(skins.net[p.id])}</span>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
};

// ── FEED ──────────────────────────────────────────────────────────────────────
const kindMeta = {
  ace:    { tone:"ace",    icon:"🕳️", label:"ACE" },
  birdie: { tone:"birdie", icon:"🐦", label:"BIRDIE" },
  skin:   { tone:"flag",   icon:"◈",  label:"SKIN" },
};
const FeedRow = ({item, playerById}) => {
  const p = playerById(item.who); const m = kindMeta[item.kind] || kindMeta.skin;
  return (
    <Card className={`flex items-start gap-3 p-3 ${item.kind==="ace"?"shadow-glow border-ace/40":""} ${item.t==="now"?"rise":""}`}>
      <Avatar p={p} size={38}/>
      <div className="min-w-0 flex-1">
        <div className="flex items-center gap-2">
          <span className="text-sm font-bold">{p.name}</span>
          <Pill tone={m.tone}>{m.icon} {m.label}</Pill>
          <span className="ml-auto text-[11px] text-dusk">{item.t}</span>
        </div>
        <p className="mt-1 text-sm text-zinc-300">{item.text}</p>
      </div>
    </Card>
  );
};
const Feed = ({feed, playerById}) => (
  <div className="space-y-2">
    {feed.map(item=> <FeedRow key={item.id} item={item} playerById={playerById}/>)}
    <p className="py-6 text-center text-xs text-dusk">Every ace, birdie, and stolen skin posts here. Tag your group, react, re-bet.</p>
  </div>
);

// ── WALLET (settle up) ─────────────────────────────────────────────────────────
const Wallet = ({skins, acePool, playerById}) => {
  const rows = [...PLAYERS].sort((a,b)=>skins.net[b.id]-skins.net[a.id]);
  const aceLine = acePool.hit ? `${playerById(acePool.hit.who).name} won the ${acePool.hit.payout}-token ace pool` : "Ace pool unclaimed — rolls forward";
  return (
    <div className="space-y-4">
      <Card className="p-4">
        <p className="mb-1 font-display font-bold">Round settlement</p>
        <p className="text-xs text-dusk">Net positions across skins. Settle in-app credits or mark cash IRL.</p>
        <div className="mt-4 space-y-2">
          {rows.map(p=>(
            <div key={p.id} className="flex items-center gap-3 rounded-xl bg-surface-2 px-3 py-2.5">
              <Avatar p={p} size={32}/>
              <span className="flex-1 text-sm font-semibold">{p.name}</span>
              <span className={`font-mono text-sm ${skins.net[p.id]>=0?"text-birdie":"text-flag"}`}>{fmtTokens(skins.net[p.id])}</span>
              {skins.net[p.id]<0 && <button className="rounded-lg bg-ace px-3 py-1 text-xs font-bold text-ink">Pay</button>}
            </div>
          ))}
        </div>
      </Card>
      <Card className="flex items-center gap-3 p-4">
        <span className="text-2xl">🕳️</span>
        <p className="text-sm text-zinc-300">{aceLine}</p>
      </Card>
      <p className="px-2 text-[11px] text-dusk">Prototype uses social tokens (no real-money wagering). Production routes to a licensed payments/contest partner per jurisdiction — see PRD §Compliance.</p>
    </div>
  );
};

// ── YOU ──────────────────────────────────────────────────────────────────────
const You = ({skins}) => (
  <div className="space-y-4">
    <Card className="flex items-center gap-4 p-4">
      <div className="grid h-16 w-16 place-items-center rounded-2xl bg-surface-2 text-3xl">🟢</div>
      <div>
        <p className="font-display text-lg font-extrabold">You</p>
        <p className="text-sm text-dusk">@you · 12.0 hcp · Cypress Ridge</p>
      </div>
    </Card>
    <div className="grid grid-cols-3 gap-2">
      <Card className="p-4"><Stat label="Career aces" value="2"/></Card>
      <Card className="p-4"><Stat label="Skins won" value={Math.round(skins.skinsWon[me])}/></Card>
      <Card className="p-4"><Stat label="Net (season)" value={<span className="text-birdie">+340</span>}/></Card>
    </div>
    <Card className="p-4">
      <p className="font-display font-bold">Your Ace Wall</p>
      <p className="text-sm text-dusk">Every hole-in-one becomes a shareable card — course, date, witnesses, the pool you took.</p>
      <div className="mt-3 grid grid-cols-2 gap-2">
        {["Pine Valley · #7 · 2024","Cypress Ridge · #3 · 2025"].map(t=>(
          <div key={t} className="rounded-xl border border-ace/30 bg-ace/5 p-3">
            <div className="text-2xl">🕳️</div>
            <p className="mt-1 text-xs text-ace">{t}</p>
          </div>
        ))}
      </div>
    </Card>
  </div>
);

  <div className="fixed inset-0 z-50 grid place-items-center bg-ink/80 px-6 backdrop-blur-sm">

      <div className="mt-4 flex justify-center gap-2">
