name: Deploy preview to GitHub Pages

# Publishes the /aces previews (NiceAce prototype, Signal Mine report, hub) to
# GitHub Pages so there's a stable, shareable URL — no Lovable/deploy needed.
# Site root redirects to the preview hub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5   # enablement defaults true → turns Pages on
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r aces _site/aces
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./aces/preview/index.html">
          <title>NiceAce + Signal Mine — preview</title></head>
          <body style="font-family:system-ui;background:#0b0a0f;color:#fff;padding:40px">
          <a style="color:#c6ff3a" href="./aces/preview/index.html">Open the preview hub →</a>
          </body></html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
